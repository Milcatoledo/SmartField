<!-- stream.html: Visualización en tiempo real de imágenes recibidas por WebSocket y su resultado -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SmartField Streaming</title>
    <link rel="stylesheet" href="/static/index.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; }
        #image-preview { max-width: 400px; max-height: 400px; border: 2px solid #333; margin-bottom: 16px; }
        #result { font-size: 1.2em; margin-top: 12px; }
        #status { color: #888; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>SmartField - Streaming WebSocket</h2>
    <div id="status">Conectando a WebSocket...</div>
    <img id="image-preview" src="" alt="Imagen recibida" style="display:none;" />
    <div id="result"></div>
    <script>
        const socket = io();
        const status = document.getElementById('status');
        const img = document.getElementById('image-preview');
        const result = document.getElementById('result');

        socket.on('connect', () => {
            status.textContent = 'Conectado a WebSocket';
        });

        socket.on('disconnect', () => {
            status.textContent = 'Desconectado de WebSocket';
        });

        // Recibe imagen y resultado
        socket.on('image_frame', data => {
            if (data.image) {
                img.src = data.image;
                img.style.display = 'block';
            }
        });

        socket.on('analysis_result', data => {
            result.innerHTML = `<b>Resultado:</b> ${data.category}<br>
                <b>Confianza:</b> ${(data.confidence * 100).toFixed(1)}%<br>
                <b>Modelo:</b> ${data.model_name}<br>
                <b>Timestamp:</b> ${data.timestamp}`;
        });

        socket.on('error', data => {
            result.innerHTML = `<span style='color:red'>Error: ${data.message}</span>`;
        });
    </script>
</body>
</html>
